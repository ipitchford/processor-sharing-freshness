name: Bounded scientific checks
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -B code/replay.py
      - run: python -B -O code/replay.py
      - run: python -B code/check_negative.py
